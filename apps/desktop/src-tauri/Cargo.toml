[package]
name = "casai-provenance-lab-desktop"
version = "0.1.0"
description = "Internet-connected desktop demo for CasAI Provenance Lab"
authors = ["CasAI"]
edition = "2024"
rust-version = "1.90"
publish = false

[build-dependencies]
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
tauri = { version = "=2.12.3", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
