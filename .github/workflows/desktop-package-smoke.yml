name: Desktop package smoke

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-package-smoke.yml"
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/**"
      - "bun.lock"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS app
            platform: macos-latest
            bundles: app
          - name: Windows installer
            platform: windows-latest
            bundles: nsis
          - name: Linux packages
            platform: ubuntu-22.04
            bundles: deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.9"

      - name: Install client dependencies
        run: bun install --frozen-lockfile

      - name: Test and build the embedded client
        run: bun run check:desktop

      - name: Install Linux desktop dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Verify native request boundaries
        run: cargo test --locked --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Build unsigned desktop package
        uses: tauri-apps/tauri-action@944946e3e4cac6603d1fe8f514171e9ecd3c78aa # v1
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          args: --bundles ${{ matrix.bundles }}
          uploadWorkflowArtifacts: true
          workflowArtifactNamePattern: "desktop-[platform]-[arch]-[bundle]"
